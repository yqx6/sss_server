version: "3.8"

services:
  sss-server:
    image: ghcr.io/yqx6/sss_server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: sss-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # 视频目录（按要求读写挂载）
      - /volume1/video:/video:rw
      # db 表已内置于镜像 /data；named volume 持久化运行时写入（首次由镜像种子初始化）
      - sss-data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/getAllGroups"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sss-data:
